name: shopcart

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env (ver .env.example)}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    ports:
      - '127.0.0.1:${SQLSERVER_PUERTO:-1433}:1433'
    volumes:
      - sqlserver-datos:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: aplica los scripts de database/ y termina. Para la base de pruebas:
  # docker compose run --rm -e DB_NOMBRE=shopcart_test db-migrator
  db-migrator:
    build:
      context: .
      dockerfile: database/migrator/Dockerfile
    environment:
      DB_HOST: sqlserver
      DB_PUERTO: 1433
      DB_NOMBRE: ${DB_NOMBRE:-ShopCart}
      DB_CONFIAR_CERTIFICADO: ${DB_CONFIAR_CERTIFICADO:-true}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env (ver .env.example)}
      DB_APP_CONTRASENA: ${DB_APP_CONTRASENA:?Define DB_APP_CONTRASENA en .env (ver .env.example)}
      DB_MIGRADOR_CONTRASENA: ${DB_MIGRADOR_CONTRASENA:?Define DB_MIGRADOR_CONTRASENA en .env (ver .env.example)}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: 'no'

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_PUERTO:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sqlserver-datos:
