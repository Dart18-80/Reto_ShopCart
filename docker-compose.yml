name: shopcart

# Cada valor tiene una sola fuente en .env. Los puertos también: SQL Server y Redis escuchan dentro
# del contenedor en el mismo DB_PORT / REDIS_PORT que se publica en el host.

# §10, mínimo privilegio: cada servicio recibe solo las variables que usa. Las réplicas nunca ven
# MSSQL_SA_PASSWORD ni DB_MIGRADOR_CONTRASENA.
x-api-entorno: &api-entorno
  NODE_ENV: ${NODE_ENV:-development}
  # nginx apunta a api-N:3000: el puerto de las réplicas no se toma de .env.
  PUERTO: '3000'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CORS_ORIGINS: ${CORS_ORIGINS:?Define CORS_ORIGINS en .env (ver .env.example)}
  DB_HOST: sqlserver
  DB_PORT: ${DB_PORT:-1433}
  DB_NOMBRE: ${DB_NOMBRE:-ShopCart}
  DB_USUARIO: ${DB_USUARIO:?Define DB_USUARIO en .env (ver .env.example)}
  DB_CONTRASENA: ${DB_CONTRASENA:?Define DB_CONTRASENA en .env (ver .env.example)}
  DB_CONFIAR_CERTIFICADO: ${DB_CONFIAR_CERTIFICADO:-true}
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_CONTRASENA: ${REDIS_CONTRASENA:?Define REDIS_CONTRASENA en .env (ver .env.example)}

# A-03, RNF-2: dos réplicas idénticas de la API; solo cambia el nombre de la réplica.
x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: shopcart-api:local
  depends_on:
    db-migrator:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  # A-03: los nombres de las dependencias salen de /etc/hosts. Con un contenedor detenido, el DNS de
  # Docker reenvía el nombre al DNS del host, que puede devolver una IP pública (comprobado en la
  # validación de E0-E1): la API mandaría el login de SQL Server o el AUTH de Redis fuera de la subred.
  extra_hosts:
    - 'sqlserver:${RED_PREFIJO:-172.28.10}.10'
    - 'redis:${RED_PREFIJO:-172.28.10}.11'
    # Reservada para el colector de OpenTelemetry (Fase 2), para que su nombre tampoco salga al DNS.
    - 'otel-lgtm:${RED_PREFIJO:-172.28.10}.40'
  restart: unless-stopped

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env (ver .env.example)}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
      MSSQL_TCP_PORT: ${DB_PORT:-1433}
    ports:
      - '127.0.0.1:${DB_PORT:-1433}:${DB_PORT:-1433}'
    volumes:
      - sqlserver-datos:/var/opt/mssql
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.10
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S "localhost,$$MSSQL_TCP_PORT" -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: aplica los scripts de database/ y termina. Para la base de pruebas:
  # docker compose run --rm -e DB_NOMBRE=shopcart_test db-migrator
  db-migrator:
    build:
      context: .
      dockerfile: database/migrator/Dockerfile
    environment:
      DB_HOST: sqlserver
      DB_PORT: ${DB_PORT:-1433}
      DB_NOMBRE: ${DB_NOMBRE:-ShopCart}
      DB_CONFIAR_CERTIFICADO: ${DB_CONFIAR_CERTIFICADO:-true}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env (ver .env.example)}
      DB_USUARIO: ${DB_USUARIO:?Define DB_USUARIO en .env (ver .env.example)}
      DB_CONTRASENA: ${DB_CONTRASENA:?Define DB_CONTRASENA en .env (ver .env.example)}
      DB_MIGRADOR_CONTRASENA: ${DB_MIGRADOR_CONTRASENA:?Define DB_MIGRADOR_CONTRASENA en .env (ver .env.example)}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.12
    extra_hosts:
      - 'sqlserver:${RED_PREFIJO:-172.28.10}.10'
    restart: 'no'

  redis:
    image: redis:7-alpine
    environment:
      REDIS_CONTRASENA: ${REDIS_CONTRASENA:?Define REDIS_CONTRASENA en .env (ver .env.example)}
      REDIS_PORT: ${REDIS_PORT:-6379}
    # La contraseña va en una variable y no en la línea de comandos de Compose, que se ve en docker inspect.
    command:
      ['sh', '-c', 'exec redis-server --port "$$REDIS_PORT" --requirepass "$$REDIS_CONTRASENA"']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:${REDIS_PORT:-6379}'
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.11
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -p "$$REDIS_PORT" -a "$$REDIS_CONTRASENA" ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 5

  api-1:
    <<: *api
    environment:
      <<: *api-entorno
      INSTANCIA_ID: api-1
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.21

  api-2:
    <<: *api
    environment:
      <<: *api-entorno
      INSTANCIA_ID: api-2
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.22

  # Balanceador y único origen: http://localhost:8080 (/api/* → api-1 y api-2; / → estáticos).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: shopcart-web:local
    ports:
      - '${WEB_IP:-127.0.0.1}:8080:80'
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.30
    # nginx resuelve las réplicas una sola vez, al arrancar, desde /etc/hosts (A-03).
    extra_hosts:
      - 'api-1:${RED_PREFIJO:-172.28.10}.21'
      - 'api-2:${RED_PREFIJO:-172.28.10}.22'
    restart: unless-stopped

# A-03: subred fija. Las IPs de .2 a .127 son fijas (una por servicio); un contenedor sin IP fija
# (por ejemplo, el perfil de observabilidad) toma una de .128 a .254, así nadie ocupa la IP de una
# réplica detenida. RED_PREFIJO se cambia en .env si la subred choca con otra red de la máquina.
networks:
  shopcart:
    ipam:
      config:
        - subnet: ${RED_PREFIJO:-172.28.10}.0/24
          ip_range: ${RED_PREFIJO:-172.28.10}.128/25
          gateway: ${RED_PREFIJO:-172.28.10}.1

volumes:
  sqlserver-datos:
