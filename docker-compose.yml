name: shopcart

# Cada valor tiene una sola fuente en .env. Los puertos también: SQL Server y Redis escuchan dentro
# del contenedor en el mismo DB_PORT / REDIS_PORT que se publica en el host.

# §10, mínimo privilegio: cada servicio recibe solo las variables que usa. Las réplicas nunca ven
# MSSQL_SA_PASSWORD ni DB_MIGRADOR_CONTRASENA.
x-api-entorno: &api-entorno
  NODE_ENV: ${NODE_ENV:-development}
  # nginx apunta a api-N:3000: el puerto de las réplicas no se toma de .env.
  PUERTO: '3000'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CORS_ORIGINS: ${CORS_ORIGINS:?Define CORS_ORIGINS en .env (ver .env.example)}
  DB_HOST: sqlserver
  DB_PORT: ${DB_PORT:-1433}
  DB_NOMBRE: ${DB_NOMBRE:-ShopCart}
  DB_USUARIO: ${DB_USUARIO:?Define DB_USUARIO en .env (ver .env.example)}
  DB_CONTRASENA: ${DB_CONTRASENA:?Define DB_CONTRASENA en .env (ver .env.example)}
  DB_CONFIAR_CERTIFICADO: ${DB_CONFIAR_CERTIFICADO:-true}
  DB_TIMEOUT_CONEXION_MS: ${DB_TIMEOUT_CONEXION_MS:-2000}
  DB_TIMEOUT_CONSULTA_MS: ${DB_TIMEOUT_CONSULTA_MS:-15000}
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_CONTRASENA: ${REDIS_CONTRASENA:?Define REDIS_CONTRASENA en .env (ver .env.example)}
  JWT_SECRETO: ${JWT_SECRETO:?Define JWT_SECRETO en .env (ver .env.example)}
  # A-24: el almacén de exportaciones, en el volumen compartido por las dos réplicas.
  ALMACEN_DIR: /var/lib/shopcart/exportaciones
  # E9-H01 (RNF-4): las réplicas siempre exportan al colector del perfil `observabilidad`. Sin el perfil, el
  # envío se intenta contra su IP de la subred (extra_hosts), nunca sale de ella, y se registra una sola vez.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
  OTEL_SEMCONV_STABILITY_OPT_IN: http

# A-03, RNF-2: dos réplicas idénticas de la API; solo cambia el nombre de la réplica.
x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: shopcart-api:local
  depends_on:
    db-migrator:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  # A-03: los nombres de las dependencias salen de /etc/hosts. Con un contenedor detenido, el DNS de
  # Docker reenvía el nombre al DNS del host, que puede devolver una IP pública (comprobado en la
  # validación de E0-E1): la API mandaría el login de SQL Server o el AUTH de Redis fuera de la subred.
  extra_hosts:
    - 'sqlserver:${RED_PREFIJO:-172.28.10}.10'
    - 'redis:${RED_PREFIJO:-172.28.10}.11'
    # El colector de OpenTelemetry (perfil `observabilidad`, E9-H01): su nombre tampoco sale al DNS.
    - 'otel-lgtm:${RED_PREFIJO:-172.28.10}.40'
  # A-24: el archivo que genera una réplica se descarga desde la otra. En producción, S3 o Azure Blob (otro
  # adaptador del puerto AlmacenArchivos), sin volumen.
  volumes:
    - exportaciones:/var/lib/shopcart/exportaciones
  restart: unless-stopped
  # Decisión del PO (E9): más que la espera máxima del apagado ordenado de la API (10 s), para que el SIGKILL de
  # Docker nunca compita con ella. Lo mismo en todo servicio con apagado ordenado (Redis y SQL Server).
  stop_grace_period: 15s

services:
  sqlserver:
    # Fijada al CU que pasó todas las suites (16.0.4305.5, KB5126934): la etiqueta y su digest. Se actualiza
    # a propósito, nunca con un pull (README, «Actualizar las imágenes»).
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    # Cierra con un checkpoint de las bases: el mismo margen que la API.
    stop_grace_period: 15s
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env (ver .env.example)}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
      MSSQL_TCP_PORT: ${DB_PORT:-1433}
    ports:
      - '127.0.0.1:${DB_PORT:-1433}:${DB_PORT:-1433}'
    volumes:
      - sqlserver-datos:/var/opt/mssql
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.10
    # Healthcheck de infraestructura, no del backend: sqlcmd necesita una consulta trivial para saber que el
    # motor acepta conexiones. La API solo ejecuta SPs (SP_Sistema_Health).
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S "localhost,$$MSSQL_TCP_PORT" -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: aplica los scripts de database/ y termina. Para la base de pruebas:
  # docker compose run --rm -e DB_NOMBRE=shopcart_test db-migrator
  db-migrator:
    build:
      context: .
      dockerfile: database/migrator/Dockerfile
    environment:
      DB_HOST: sqlserver
      DB_PORT: ${DB_PORT:-1433}
      DB_NOMBRE: ${DB_NOMBRE:-ShopCart}
      DB_CONFIAR_CERTIFICADO: ${DB_CONFIAR_CERTIFICADO:-true}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env (ver .env.example)}
      DB_USUARIO: ${DB_USUARIO:?Define DB_USUARIO en .env (ver .env.example)}
      DB_CONTRASENA: ${DB_CONTRASENA:?Define DB_CONTRASENA en .env (ver .env.example)}
      DB_MIGRADOR_CONTRASENA: ${DB_MIGRADOR_CONTRASENA:?Define DB_MIGRADOR_CONTRASENA en .env (ver .env.example)}
      # Como en la API: con production rechaza las contraseñas de ejemplo (la imagen trae production).
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.12
    extra_hosts:
      - 'sqlserver:${RED_PREFIJO:-172.28.10}.10'
    restart: 'no'

  redis:
    # Versión exacta y digest: se actualiza a propósito (README, «Actualizar las imágenes»), nunca con un pull.
    image: redis:7.4.12-alpine3.21@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    # El entrypoint oficial solo baja a "redis" cuando el comando empieza con redis-server; con sh -c correría
    # como root. /data ya pertenece a redis en la imagen.
    user: redis
    # Guarda el volcado al recibir SIGTERM: el mismo margen que la API.
    stop_grace_period: 15s
    environment:
      REDIS_CONTRASENA: ${REDIS_CONTRASENA:?Define REDIS_CONTRASENA en .env (ver .env.example)}
      REDIS_PORT: ${REDIS_PORT:-6379}
    # La contraseña va en una variable y no en la línea de comandos de Compose, que se ve en docker inspect.
    command:
      ['sh', '-c', 'exec redis-server --port "$$REDIS_PORT" --requirepass "$$REDIS_CONTRASENA"']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:${REDIS_PORT:-6379}'
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.11
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -p "$$REDIS_PORT" -a "$$REDIS_CONTRASENA" ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 5

  api-1:
    <<: *api
    environment:
      <<: *api-entorno
      INSTANCIA_ID: api-1
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.21

  api-2:
    <<: *api
    environment:
      <<: *api-entorno
      INSTANCIA_ID: api-2
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.22

  # Balanceador y único origen: http://localhost:8080, o el WEB_PUERTO de .env (/api/* → api-1 y api-2; / → estáticos).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: shopcart-web:local
    ports:
      - '${WEB_IP:-127.0.0.1}:${WEB_PUERTO:-8080}:80'
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.30
    # nginx resuelve las réplicas una sola vez, al arrancar, desde /etc/hosts (A-03).
    extra_hosts:
      - 'api-1:${RED_PREFIJO:-172.28.10}.21'
      - 'api-2:${RED_PREFIJO:-172.28.10}.22'
    restart: unless-stopped

  # E9-H01 (RNF-4): Grafana LGTM (colector OTLP, Tempo, Loki, Prometheus y Grafana). Opcional: se levanta con
  # `docker compose --profile observabilidad up -d`. Imagen de desarrollo: corre como root y Grafana entra como
  # Admin anónimo, por eso solo se publica en 127.0.0.1; los puertos OTLP no se publican.
  otel-lgtm:
    image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    profiles: [observabilidad]
    environment:
      # Sin salidas a internet: el arranque de la imagen preinstala un plugin y Grafana busca actualizaciones.
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_PUERTO:-3001}:3000'
    volumes:
      - ./infra/grafana/provisioning/dashboards/shopcart.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/shopcart.yaml:ro
      - ./infra/grafana/dashboards:/otel-lgtm/shopcart-dashboards:ro
    networks:
      shopcart:
        ipv4_address: ${RED_PREFIJO:-172.28.10}.40
    restart: unless-stopped

# A-03: subred fija. Las IPs de .2 a .127 son fijas (una por servicio); un contenedor sin IP fija
# toma una de .128 a .254, así nadie ocupa la IP de una
# réplica detenida. RED_PREFIJO se cambia en .env si la subred choca con otra red de la máquina.
networks:
  shopcart:
    ipam:
      config:
        - subnet: ${RED_PREFIJO:-172.28.10}.0/24
          ip_range: ${RED_PREFIJO:-172.28.10}.128/25
          gateway: ${RED_PREFIJO:-172.28.10}.1

volumes:
  sqlserver-datos:
  exportaciones:
