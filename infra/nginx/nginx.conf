# A-03: nginx es el balanceador de carga y el único origen (http://localhost:8080):
# /api/* va a las réplicas en round-robin y el resto sirve los archivos estáticos de la web.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;

    # La réplica que atendió cada petición queda en el log de nginx (útil en la demo).
    log_format principal '$remote_addr "$request" $status $body_bytes_sent ${request_time}s '
                         'upstream=$upstream_addr instancia=$upstream_http_x_instancia';
    access_log /var/log/nginx/access.log principal;

    # Detección pasiva de fallas: 3 errores en 10 s sacan a la réplica de la rotación por 10 s.
    # `zone` comparte entre los workers de nginx el turno del round-robin y el conteo de fallas;
    # sin ella, cada worker lleva el suyo y las peticiones no alternan.
    # `resolve` (nginx ≥ 1.27.3) consulta el DNS de Docker en tiempo de ejecución: nginx arranca aunque
    # una réplica esté detenida (si no, falla con "host not found") y la vuelve a encontrar cuando regresa.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api {
        zone api 64k;
        server api-1:3000 max_fails=3 fail_timeout=10s resolve;
        server api-2:3000 max_fails=3 fail_timeout=10s resolve;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Si una réplica no responde, la petición se reintenta en la otra. nginx nunca reintenta
            # métodos no idempotentes (POST, PATCH) salvo que se lo pidan: un pago no se duplica aquí.
            proxy_connect_timeout     2s;
            proxy_read_timeout        30s;
            proxy_next_upstream       error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
        }
    }
}
